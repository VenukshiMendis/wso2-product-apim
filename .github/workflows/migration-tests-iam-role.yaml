name: Test S3 Access with IAM Role

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-s3-access:
    runs-on: ubuntu-latest

    steps:
      - name: Mask Sensitive Info
        run: |
          echo "::add-mask::${{ secrets.AWS_ROLE_ARN }}"
          echo "::add-mask::migration-clients-s3-bucket"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          output-credentials: false

      - name: List bucket contents
        run: |
          # Use a variable for the bucket name so it's not hardcoded in the logs
          BUCKET_NAME="migration-clients-s3-bucket"
          echo "Listing objects in S3 bucket..."
          aws s3 ls s3://$BUCKET_NAME/ --recursive

      - name: Download ZIP files
        run: |
          BUCKET_NAME="migration-clients-s3-bucket"
          mkdir -p s3-downloads
          echo "Downloading ZIP files..."
          aws s3 cp s3://$BUCKET_NAME/ s3-downloads/ \
            --recursive \
            --exclude "*" \
            --include "*.zip"

          echo "Downloaded files:"
          ls -la s3-downloads/