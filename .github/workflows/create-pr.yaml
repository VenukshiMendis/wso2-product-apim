name: Test Aggregated Notifications & PR Bot

on:
  workflow_dispatch:
    inputs:
      mock_version:
        description: 'Mock version to inject into pom.xml'
        required: true
        default: '9.9.9'
        type: string
      fail_oracle:
        description: 'Intentionally fail the Oracle test?'
        required: true
        type: boolean
        default: true
      fail_mssql:
        description: 'Intentionally fail the MSSQL test?'
        required: true
        type: boolean
        default: false

jobs:
  # 1. THE MOCK MATRIX (Simulates your database tests)
  mock-matrix-tests:
    name: prepare-and-migrate - ${{ matrix.display_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_type: mysql
            display_name: "MySQL"
          - db_type: mssql
            display_name: "MSSQL"
          - db_type: postgre
            display_name: "PostgreSQL"
          - db_type: oracle
            display_name: "Oracle"
    steps:
      - name: Force Failure for All Databases
        run: |
          echo "🚨 Intentionally failing ${{ matrix.display_name }} for testing purposes."
          exit 1

  # 2. THE FAILURE NOTIFICATION JOB (Only runs if matrix fails)
  notify-failure:
    needs: [mock-matrix-tests]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required to read the workflow job statuses
    steps:
      - name: Identify failed databases and notify Google Chat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching job status from GitHub API..."
          
          # Ask GitHub API for the status of jobs in this specific workflow run
          JOB_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          
          # Filter for failed jobs, extract their names, format the string
          FAILED_DBS=$(echo "$JOB_DATA" \
            | jq -r '[.jobs[] | select(.conclusion == "failure" and (.name | contains("prepare-and-migrate"))) | .name | ssub("prepare-and-migrate - "; "")] | join(", ")')
                  
          # Fallback if API parsing fails
          if [ -z "$FAILED_DBS" ]; then
            FAILED_DBS="Multiple (Check Workflow Logs)"
          fi
          
          echo "Failed Databases identified: $FAILED_DBS"
          
          PAYLOAD="{\"text\": \"❌ *APIM Migration Tests Failed!*\nFailed Databases: *${FAILED_DBS}*\nPlease investigate the logs here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          
          curl -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "${{ secrets.GOOGLE_CHAT_WEBHOOK}}"

  # 3. THE PR CREATION JOB (Only runs if matrix succeeds)
  test-pr-creation:
    needs: [mock-matrix-tests]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CARBON_APIMGT_VERSION_PROPERTY: carbon.apimgt.version
    steps:
      - name: Checkout product-apim
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Read current carbon-apimgt version from Maven
        working-directory: all-in-one-apim
        run: |
          CURRENT=$(mvn -q \
            -Dexpression=${CARBON_APIMGT_VERSION_PROPERTY} \
            -DforceStdout \
            help:evaluate 2>/dev/null || true)

          echo "Current carbon-apimgt version: $CURRENT"
          echo "CURRENT_CARBON_APIMGT_VERSION=$CURRENT" >> $GITHUB_ENV

      - name: Update pom.xml with Mock Version
        working-directory: all-in-one-apim
        run: |
          LATEST="${{ github.event.inputs.mock_version }}"
          echo "Bumping ${CARBON_APIMGT_VERSION_PROPERTY} from ${CURRENT_CARBON_APIMGT_VERSION} to $LATEST"
          
          mvn -B \
            org.codehaus.mojo:versions-maven-plugin:2.16.2:set-property \
            -Dproperty=${CARBON_APIMGT_VERSION_PROPERTY} \
            -DnewVersion=$LATEST \
            -DgenerateBackupPoms=false

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump carbon-apimgt to ${{ github.event.inputs.mock_version }}"
          title: "Automated Version Bump Test: carbon-apimgt to ${{ github.event.inputs.mock_version }}"
          body: |
            This is a test of the automated PR bot.
            - **Previous version:** `${{ env.CURRENT_CARBON_APIMGT_VERSION }}`
            - **New version:** `${{ github.event.inputs.mock_version }}`
          branch: "bot/test-version-bump"
          base: "${{ github.ref_name }}"
          labels: "automated pr, test"

      - name: Notify Google Chat on PR Creation
        if: steps.create_pr.outputs.pull-request-url != ''
        run: |
          PAYLOAD="{\"text\": \"✅ *APIM Migration Tests Passed!*\nA new automated version bump PR has been successfully created.\n👉 *Review PR:* ${{ steps.create_pr.outputs.pull-request-url }}\"}"
          
          curl -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "${{ secrets.GOOGLE_CHAT_WEBHOOK }}"